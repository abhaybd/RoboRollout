site_name: RoboRollout
site_description: A lightweight framework for real-robot policy evaluation
site_url: https://abhaybd.github.io/RoboRollout/
repo_url: https://github.com/abhaybd/RoboRollout
repo_name: abhaybd/RoboRollout
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting Started:
      - "Getting Started: Franka DROID": getting-started/droid.md
      - "Getting Started: Bimanual YAM": getting-started/yam.md
  - Usage:
      - Running evaluations: usage/running-evaluations.md
      - Configuration: usage/configuration.md
      - Policy servers: usage/policy-servers.md
      - Cameras: usage/cameras.md
      - Collating datasets: usage/collating-datasets.md
      - Adding a new robot: usage/adding-a-robot.md
  - API Reference:
      - robo_rollout.rollout: api/rollout.md
      - robo_rollout.robot: api/robot.md
      - robo_rollout.config: api/config.md
      - robo_rollout.policy: api/policy.md
      - robo_rollout.cameras: api/cameras.md
      - robo_rollout.utils: api/utils.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: true
            show_signature_annotations: true
            show_source: true
            show_if_no_docstring: true
            filters: ["!^_", "!^log$", "!^logger$"]
