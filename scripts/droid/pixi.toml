[workspace]
name = "robo_rollout_droid"
version = "0.1.0"
description = "RoboRollout entrypoint for the Franka DROID setup"
channels = ["pytorch", "fair-robotics", "aihabitat", "conda-forge"]
platforms = ["linux-64"]

[workspace.conda-pypi-map]
# polymetis pins hydra-core 1.0.6, but robo_rollout needs hydra-core 1.3 (the client side of polymetis works fine with it).
# Telling pixi that these conda packages don't provide their PyPI counterparts lets the PyPI solve install
# the newer versions over them, like `pip install` does in a conda env.
conda-forge = { mapping = { hydra-core = false, omegaconf = false, antlr-python-runtime = false } }

[dependencies]
python = "3.8.*"
polymetis = "*"
# pytorch 1.13 fails to import with mkl>=2024.1 (undefined symbol: iJIT_NotifyEvent)
mkl = "<2024.1"
# the pytorch channel's ffmpeg (pulled in by habitat-sim) has no h264 encoder, which robo_rollout uses to write rollout videos
ffmpeg = { version = "*", build = "gpl*", channel = "conda-forge" }

[pypi-dependencies]
robo_rollout = { path = "../..", editable = true }

[tasks]
# installs the ZED SDK python bindings into this environment
install-zed = "cd /usr/local/zed && python get_python_api.py"
