name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 for the DROID setup (polymetis), 3.12 for newer setups such as the YAM
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        # used to write rollout videos
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install dependencies
        # the gopro extra provides protobuf, which the camera tests need
        run: uv pip install -e ".[test,gopro]"
      - name: Run tests
        run: python -m pytest -v -rs
