[project]
name = "robo_rollout"
version = "0.1.0"
description = "Package to enable easy policy evaluation on robot hardware"
requires-python = ">=3.8"
dependencies = [
    "hydra-core~=1.3.0",
    "msgpack>=1.0.6",
    "msgpack-numpy",
    "numpy",
    "opencv-python",
    "Pillow",
    "wandb",
    "websockets",
]

[project.optional-dependencies]
gopro = [
    "protobuf",
]
realsense = [
    "protobuf",
    "pyrealsense2",
]
test = [
    "pytest",
]
docs = [
    # mkdocs 2 removes the plugin system, which mkdocstrings needs
    "mkdocs<2",
    "mkdocs-material",
    "mkdocstrings[python]",
    "ruff",  # used by mkdocstrings to format signatures
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["robo_rollout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
