[project]
name = "ai2_robot_infra"
version = "0.1.0"
description = "Common robot infrastructure for Ai2 robotics."
requires-python = ">=3.8"
dependencies = [
    "hydra-core~=1.3.0",
    "moviepy",
    "msgpack>=1.0.6",
    "msgpack-numpy",
    "numpy",
    "opencv-python",
    "Pillow",
    "wandb",
    "websockets",
]

[project.optional-dependencies]
gopro = [
    "protobuf",
]
realsense = [
    "protobuf",
    "pyrealsense2",
]
zed = [
    "pyzed",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai2_robot_infra*"]
